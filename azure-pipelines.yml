# Azure Pipelines CI — mirrors .github/workflows/ci.yml
# Runs the Jest test suite on every push/PR to main using a Microsoft-hosted agent.
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js 20'

  - script: npm ci
    displayName: 'npm ci'

  - script: npm test
    displayName: 'npm test'
